version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nstech-postgres
    environment:
      POSTGRES_DB: nstech_challenge
      POSTGRES_USER: nstech
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nstech -d nstech_challenge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nstech-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nstech_challenge;Username=nstech;Password=admin123
      - Jwt__SecretKey=NsTechSuperSecretJwtKey2026_Minimum32Bytes!
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: